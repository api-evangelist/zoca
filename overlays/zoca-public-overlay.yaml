- target: $.info
  description: Record the two contract defects that block every operationId-keyed toolchain.
  update:
    x-apievangelist-contract-defects:
    - defect: minified-operation-ids
      detail: operationId is the literal string "t_value" on 2,621 of the 2,624 operations across Zoca's three published
        documents. SDK generators, Arazzo, MCP tool forges and Agent Skills all key on operationId and cannot consume
        these specs as published.
      remedy: Set explicit @ApiOperation({operationId}) or disable controller-method mangling in the production
        build.
    - defect: anonymous-minified-schemas
      detail: components.schemas contains only anonymous single-letter schemas (e, t, Object) and every response
        $refs one of them, so no request or response body is typed and there is no entity graph.
      remedy: Emit DTO classes with @ApiProperty so NestJS/Swagger names the schemas.
    - defect: no-published-servers
      detail: servers[] is empty, so the document does not state which host it describes.
      remedy: Configure the Swagger document builder addServer().
