      operationId: t_value
      parameters:
      - name: app-version
        in: header
        description: Mobile app version
        required: false
        schema:
          type: string
      - name: source
        in: header
        description: Source of the request (e.g., "zoca-app")
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Status counts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - DRAFT
                      - FUTURE
                      - LIVE
                      - PAUSED
                      - EXPIRED
                      example: LIVE
                    count:
                      type: number
                      example: 10
                example:
                - status: DRAFT
                  count: 2
                - status: FUTURE
                  count: 5
                - status: LIVE
                  count: 10
                - status: PAUSED
                  count: 1
                - status: EXPIRED
                  count: 0
      summary: Get count of offers grouped by status for an entity
      tags:
      - App
    servers:
    - url: https://api.zoca.ai
      description: Production
  /offers/entities/{entityId}/search:
    get:
      description: Performs case-insensitive partial matching on offer titles. Returns offers with all associations (services, media, CTAs, addons, channels) and calculated status (DRAFT, FUTURE, LIVE, PAUSED, EXPIRED). Uses page-based pagination for better UX.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Offers retrieved successfully with pagination metadata and calculated status
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  totalCount:
                    type: number
                    example: 25
                  totalPages:
                    type: number
                    example: 3
                  currentPage:
                    type: number
                    example: 1
        '400':
          description: Invalid search parameters
      summary: Search offers by title with status calculation
      tags:
      - App
    servers:
    - url: https://api.zoca.ai
      description: Production
  /offers/{offerId}/suggestions:
    get:
      description: Retrieves all suggestions for a specific offer from the requests table along with their request status and creation timestamp. The createdAt field is converted to a DateTime object with separate date and time components. Suggestions are ordered by creation date descending (newest first).
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Suggestions retrieved successfully with status and creation timestamp
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: COMPLETED
                    suggestion:
                      type: string
                      example: Update the offer description to be more clear
                    createdAt:
                      type: object
                      description: DateTime object with separate date and time components
                      properties:
                        date:
                          type: object
                          properties:
                            year:
                              type: number
                              example: 2025
                            month:
                              type: number
                              example: 12
                            day:
                              type: number
                              example: 9
                        time:
                          type: object
                          properties:
                            hours:
                              type: number
                              example: 14
                            minutes:
                              type: number
                              example: 30
                            seconds:
                              type: number
                              example: 0
                            nanos:
                              type: number
                              example: 0
                example:
                - status: COMPLETED
                  suggestion: Update the offer description to be more clear
                  createdAt:
                    date:
                      year: 2025
                      month: 12
                      day: 9
                    time:
                      hours: 14
                      minutes: 30
                      seconds: 0
                      nanos: 0
                - status: PENDING
                  suggestion: Add more details about the discount
                  createdAt:
                    date:
                      year: 2025
                      month: 12
                      day: 8
                    time:
                      hours: 10
                      minutes: 15
                      seconds: 30
                      nanos: 0
        '400':
          description: Invalid request parameters
      summary: Get suggestions for an offer
      tags:
      - App
    servers:
    - url: https://api.zoca.ai
      description: Production
