      operationId: t_value
      parameters:
      - name: businessEntityId
        required: true
        in: query
        description: The business entity id
        schema:
          type: string
      - name: locationEntityId
        required: true
        in: query
        description: The location entity id
        schema:
          type: string
      - name: userEntityId
        required: true
        in: query
        description: The user entity id
        schema:
          type: string
      responses:
