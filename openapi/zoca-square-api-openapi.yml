  /tasks/api/v1/square/customer/{customerId}:
    get:
      description: Fetches customer details from Square by customer ID for a specific entity
      operationId: t_value
      parameters:
      - name: customerId
        required: true
        in: path
        description: Square customer ID to retrieve
        schema:
          example: CUST_123ABC
      responses:
        '200':
          description: Successfully retrieved customer
        '404':
          description: Customer not found
        '500':
          description: Error retrieving customer
      summary: Retrieve a Square customer by ID
      tags:
      - Square
      security:
      - access-token: []
    servers:
    - url: https://tasks.zoca.ai
      description: Production
  /tasks/api/v1/square/customer/{customerId}/cards:
    get:
      description: Retrieves all payment cards associated with a Square customer
      operationId: t_value
      parameters:
      - name: customerId
        required: true
        in: path
        description: Square customer ID
        schema:
          example: CUST_123ABC
      responses:
        '200':
          description: Successfully retrieved customer cards
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Card ID
                    cardBrand:
                      type: string
                      description: Card brand (VISA, MASTERCARD, etc.)
                    last4:
                      type: string
                      description: Last 4 digits of card
                    expMonth:
                      type: number
                      description: Expiration month
                    expYear:
                      type: number
                      description: Expiration year
                    cardholderName:
                      type: string
                      description: Name on card
                    billingAddress:
                      type: object
                      description: Billing address
        '404':
          description: Customer not found
        '500':
          description: Error listing cards
      summary: List all cards on file for a customer
      tags:
      - Square
      security:
      - access-token: []
    servers:
    - url: https://tasks.zoca.ai
      description: Production
  /tasks/api/v1/square/create/customer/{customerId}/cards:
    post:
      description: Adds a new payment card to a Square customer profile
      operationId: t_value
      parameters:
      - name: customerId
        required: true
        in: path
        description: Square customer ID
        schema:
          example: CUST_123ABC
      requestBody:
        required: true
        description: Card creation parameters
        content:
          application/json:
            schema:
              type: object
              required:
              - entityId
              - sourceId
              - card
              properties:
                entityId:
                  type: string
                  description: Entity ID for authentication
                  example: entity-123
                sourceId:
                  type: string
                  description: Card nonce from Square Web Payments SDK
                  example: cnon:card-nonce-ok
                card:
                  type: object
                  required:
                  - sourceId
                  - cardholderName
                  - billingAddress
                  properties:
                    sourceId:
                      type: string
                      description: Card nonce from Square Web Payments SDK
                    cardholderName:
                      type: string
                      description: Name on card
                      example: John Doe
                    billingAddress:
                      type: object
                      required:
                      - addressLine1
                      - locality
                      - administrativeDistrictLevel1
                      - postalCode
                      - country
                      properties:
                        addressLine1:
                          type: string
                          example: 123 Main St
                        addressLine2:
                          type: string
                          example: Apt 4B
                        locality:
                          type: string
                          example: San Francisco
                        administrativeDistrictLevel1:
                          type: string
                          example: CA
                        postalCode:
                          type: string
                          example: '94102'
                        country:
                          type: string
                          example: US
      responses:
        '201':
          description: Card created successfully
        '400':
          description: Invalid card data
        '404':
          description: Customer not found
        '500':
          description: Error creating card
      summary: Create a new card on file for a customer
      tags:
      - Square
      security:
      - access-token: []
    servers:
    - url: https://tasks.zoca.ai
      description: Production
components:
  schemas:
    e:
      type: object
      properties:
        id:
          type: number
        entityId:
          type: string
        attribute:
          type: string
        value:
          type:
          - object
          - 'null'
        metadata:
          type:
          - object
          - 'null'
        createdAt:
          type:
          - object
          - 'null'
      required:
      - id
      - entityId
      - attribute
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: Authorization
      description: Enter JWT token in the format Bearer <token>
      in: header
