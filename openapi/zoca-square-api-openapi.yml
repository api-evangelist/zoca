  /tasks/api/v1/square/services/{entityId}:
    get:
      description: Fetches all Square catalog services with their variation IDs, prices, and durations for the given entity
      operationId: t_value
      parameters:
      - name: entityId
        required: true
        in: path
        description: The entity ID to fetch services for
        schema:
          example: c65a879b-bf21-4b5c-ace5-51992c4a1e62
      responses:
        '200':
          description: Successfully retrieved services with variations
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Square catalog item ID
                        name:
                          type: string
                          description: Service name
                        description:
                          type:
                          - string
                          - 'null'
                          description: Service description
                        variations:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Variation ID
                              name:
                                type: string
                                description: Variation name
                              version:
                                type: number
                                description: Variation version
                              priceMoney:
                                type:
                                - object
                                - 'null'
                                properties:
                                  amount:
                                    type: number
                                    description: Price in smallest currency unit (cents)
                                  currency:
                                    type: string
                                    description: Currency code (e.g., USD)
                              serviceDuration:
                                type:
                                - number
                                - 'null'
                                description: Service duration in milliseconds
                  locationId:
                    type: string
                    description: Square location ID
                  merchantId:
                    type: string
                    description: Square merchant ID
        '404':
          description: Entity or location not found
        '500':
          description: Error fetching services
      summary: Get all services with variation IDs for an entity
      tags:
      - Square
      security:
      - access-token: []
    servers:
    - url: https://tasks.zoca.ai
      description: Production
  /tasks/api/v1/square/webhook:
