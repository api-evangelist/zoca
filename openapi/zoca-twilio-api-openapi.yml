        '200':
          description: ''
      tags:
      - twilio
  /tasks/api/v1/twilio/phone/purchase:
    post:
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - twilio
  /tasks/api/v1/twilio/phone/search/{entityId}:
    get:
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - twilio
  /tasks/api/v1/twilio/connect-call:
    post:
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - twilio
  /tasks/api/v1/twilio/voice-bridge:
    get:
      description: Generates TwiML response for Twilio voice bridge with recording enabled
      operationId: t_value
      parameters:
      - name: CallSid
        required: false
        in: query
        description: Call SID from Twilio
        schema: {}
      - name: twilioNumber
        required: false
        in: query
        description: Twilio phone number
        schema: {}
      - name: callerNumber
        required: false
        in: query
        description: Phone number of the caller
        schema: {}
      - name: receiverNumber
        required: true
        in: query
        description: Phone number of the receiver
        schema: {}
      responses:
        '200':
          description: TwiML response generated successfully
          content:
            text/xml:
              schema:
                type: string
                example: <?xml version="1.0" encoding="UTF-8"?><Response><Dial record="record-from-answer-dual">+1234567890</Dial></Response>
      summary: Generate TwiML for voice bridge (GET)
      tags:
      - twilio
    post:
      description: Generates TwiML response for Twilio voice bridge with recording enabled
      operationId: t_value
      parameters:
      - name: twilioNumber
        required: false
        in: query
        description: Twilio phone number
        schema: {}
      - name: callerNumber
        required: false
        in: query
        description: Phone number of the caller
        schema: {}
      - name: receiverNumber
        required: false
        in: query
        description: Phone number of the receiver
        schema: {}
      requestBody:
        required: true
        description: Voice bridge request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/e'
      responses:
        '200':
          description: TwiML response generated successfully
          content:
            text/xml:
              schema:
                type: string
                example: <?xml version="1.0" encoding="UTF-8"?><Response><Dial record="record-from-answer-dual">+1234567890</Dial></Response>
      summary: Generate TwiML for voice bridge (POST)
      tags:
      - twilio
  /tasks/api/v1/twilio/outgoing-call:
    post:
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - twilio
  /tasks/api/v1/twilio/outgoing-call-dash:
    post:
      operationId: t_value
