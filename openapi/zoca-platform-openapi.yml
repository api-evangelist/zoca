  /staff/invites:
    post:
      description: Owner-only. Emits an `auth.invites` row, fires `staff-mgmt.invite.created`, and returns the persisted record (token included so the dispatch worker can render the email body — clients should redact before logging).
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: Invite created.
        '400':
          description: Validation error / mass-assignment attempt.
        '401':
          description: Unauthenticated.
        '403':
          description: Denied `staff:member.invite` action.
        '429':
          description: Send rate limit exceeded.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Send a staff invite to an existing or prospective user.
      tags:
      - Staff Invites
    get:
      description: Page-default 50, max 200 per page. Use `nextCursor` to walk further. `?status=` filters to a single state when set (`PENDING | ACCEPTED | CANCELLED | EXPIRED`).
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Page of invite records.
        '400':
          description: Invalid status / pagination param.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `staff:read` scope.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: List invites at a business (cursor-paginated).
      tags:
      - Staff Invites
  /staff/invites/{token}:
    get:
      description: Read-only view used by the accept-invite page before the invitee has signed in. No JWT required — the token in the path is the bearer credential. Skips the staff-management killswitch so accept flows survive a write-side flip.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Invite record (lazy-expired if PENDING + past TTL).
        '404':
          description: Token unknown or malformed.
        '410':
          description: Invite expired.
      security:
      - bearer: []
      summary: Public lookup of an invite by token.
      tags:
      - Staff Invites
  /staff/invites/{token}/email-match:
    get:
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Match result.
        '401':
          description: Unauthenticated.
        '404':
          description: Invite not found / token invalid.
      security:
      - bearer: []
      summary: Precheck the acceptor's email against the invite (read-only).
      tags:
      - Staff Invites
  /staff/invites/{token}/accept:
    post:
      description: 'Materializes the role assignment, permission overrides, and staff_assignments rows per spec §12.5. Idempotent — re-accepting the same invite as the same user returns the existing record with `kind: "already-accepted"`.'
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Accepted or replay (`kind` field disambiguates).
        '400':
          description: Malformed token / DTO validation error.
        '401':
          description: Unauthenticated.
        '404':
          description: Invite not found / token invalid.
        '409':
          description: Invite already accepted by another user.
        '410':
          description: Invite expired.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Accept an invite — authenticated as the invitee.
      tags:
      - Staff Invites
  /staff/invites/{inviteId}:
    patch:
      description: Owner-only. Re-assigns the role (and optionally the locations / permission overrides) a PENDING invite will materialize on accept. Rejects non-PENDING invites with 409 and unknown roles with 404.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Updated invite record.
        '400':
          description: Validation error / mass-assignment attempt.
        '401':
          description: Unauthenticated.
        '403':
          description: Denied `staff:invite.update` action.
        '404':
          description: Invite not found / role not found.
        '409':
          description: Invite is not PENDING (cannot edit role).
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Update the role on a pending invite (applied when the invitee accepts).
      tags:
      - Staff Invites
    delete:
      operationId: t_value
      parameters: []
      responses:
        '204':
          description: Revoked.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `manageStaffPermissions` scope.
        '404':
          description: Invite not found.
        '409':
          description: Invite already accepted (cannot revoke).
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Revoke a pending invite (idempotent flip to CANCELLED).
      tags:
      - Staff Invites
  /staff/roles:
    get:
      description: Returns staff-assignable service-provider roles (`SP` and `SP_*`) plus this business’ custom permission sets. Customer, guest, internal, legacy business, and other businesses’ custom records are excluded.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Array of role records.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `staff:read` scope.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: List staff roles and permission sets available at a business.
      tags:
      - Staff Roles
    post:
      description: Enforces `uq_roles_name_entity` (`(entityId, name)`) — same name at same business returns 409. `scopes` keys are validated against `USER_PERMISSION_VALUES`.
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: Role created.
        '400':
          description: Validation error (unknown scope, mass-assignment, etc).
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `modifyStaffRoles` scope.
        '409':
          description: Role name already exists at this business.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Create a per-business custom role.
      tags:
      - Staff Roles
  /staff/roles/{roleId}:
    patch:
      description: Bumps `presetVersion` and fans out to every un-modified `auth.user_roles` row (spec §2.1 Flow 6). Built-in (SYSTEM) roles cannot be patched — 403.
      operationId: t_value[0]
      parameters: []
      responses:
        '200':
          description: Updated role record.
        '400':
          description: Validation error.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing scope OR built-in role.
        '404':
          description: Role not found.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Replace the scope preset on a custom role.
      tags:
      - Staff Roles
    delete:
      description: Hard-DELETE on `auth.roles` cascades to assignment rows. Built-in roles are protected (403). Response includes the count of unassigned users for UI summary.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Role deleted.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing scope OR built-in role.
        '404':
          description: Role not found.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Delete a custom role (cascades to `auth.user_roles`).
      tags:
      - Staff Roles
  /staff/roles/{roleId}/scopes:
    patch:
      description: Bumps `presetVersion` and fans out to every un-modified `auth.user_roles` row (spec §2.1 Flow 6). Built-in (SYSTEM) roles cannot be patched — 403.
      operationId: t_value[1]
      parameters: []
      responses:
        '200':
          description: Updated role record.
        '400':
          description: Validation error.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing scope OR built-in role.
        '404':
          description: Role not found.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Replace the scope preset on a custom role.
      tags:
      - Staff Roles
  /staff/roles/assignments:
    post:
      description: Captures `appliedPresetVersion` at assign time (snapshot semantics per FC-ST-10). `permissionsModifiedFromRole` starts false and flips when overrides land later.
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: Assignment created.
        '400':
          description: Validation error.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `manageStaffPermissions` scope.
        '404':
          description: Role not found.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Assign a role to a user at a business.
      tags:
      - Staff Roles
    put:
      description: Revokes existing BUSINESS_ENTITY assignments for the (user, business) pair, then assigns the new role. Used by the Overview role select.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Role set.
        '400':
          description: Validation error.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `manageStaffPermissions` scope.
        '404':
          description: Role not found.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Set (replace) a user's role at a business.
      tags:
      - Staff Roles
  /staff/roles/assignments/{userRoleId}:
    delete:
      description: Idempotent. The 5-minute permission cache TTL flushes any stale effective-scope reads; explicit cache invalidation lands in W5.2 observability wiring.
      operationId: t_value
      parameters: []
      responses:
        '204':
          description: Revoked.
        '401':
          description: Unauthenticated.
        '403':
          description: Missing `manageStaffPermissions` scope.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Revoke a `auth.user_roles` assignment by id.
      tags:
      - Staff Roles
  /staff/permissions/users/{userEntityId}:
    get:
      description: Returns one `auth.user_permissions` row per scope diverging from the role preset. Empty array means the user’s effective scopes match their role exactly.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Array of override rows.
        '401':
          description: Unauthenticated.
        '403':
          description: Denied `staff:member.read` action.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Read a user’s per-business override map.
      tags:
      - Staff Permissions
  /staff/permissions/users/{userEntityId}/apply:
    post:
      description: Routes through the cascade engine. Body supports `toggleOn` / `toggleOff` (incremental) OR `setExact` (declarative). FC-AZ-11 — non-owner actors cannot grant scopes outside their own effective set; 403 is the rejection path.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Overrides applied (counts in response).
        '400':
          description: Validation error / unknown scope key.
        '401':
          description: Unauthenticated.
        '403':
          description: Denied `staff:member.permission.manage` action OR actor cannot grant outside own set.
        '503':
          description: Feature disabled (killswitch).
      security:
      - bearer: []
      summary: Apply per-business permission overrides for a user.
      tags:
      - Staff Permissions
