  /scheduling/sales:
    get:
      description: Retrieves sales with optional filters for status, date range, item/client search, amount ranges, and pagination. Returns total count for pagination UI.
      operationId: t_value
      parameters:
      - name: limit
        required: false
        in: query
        description: Results per page (max 100)
        schema:
          example: 20
          type: number
      - name: page
        required: false
        in: query
        description: Page number (starts at 1)
        schema:
          example: 1
          type: number
      - name: maxTotal
        required: false
        in: query
        description: Maximum total amount
        schema:
          type: number
      - name: minTotal
        required: false
        in: query
        description: Minimum total amount
        schema:
          type: number
      - name: maxTip
        required: false
        in: query
        description: Maximum tip amount
        schema:
          type: number
      - name: minTip
        required: false
        in: query
        description: Minimum tip amount
        schema:
          type: number
      - name: maxTax
        required: false
        in: query
        description: Maximum tax amount
        schema:
          type: number
      - name: minTax
        required: false
        in: query
        description: Minimum tax amount
        schema:
          type: number
      - name: maxDiscount
        required: false
        in: query
        description: Maximum discount amount
        schema:
          type: number
      - name: minDiscount
        required: false
        in: query
        description: Minimum discount amount
        schema:
          type: number
      - name: maxSubtotal
        required: false
        in: query
        description: Maximum subtotal
        schema:
          type: number
      - name: minSubtotal
        required: false
        in: query
        description: Minimum subtotal
        schema:
          type: number
      - name: dateTo
        required: false
        in: query
        description: Only sales created at or before this ISO instant
        schema:
          type: string
      - name: dateFrom
        required: false
        in: query
        description: Only sales created at or after this ISO instant
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Free-text match on sold service/product names or the client name
        schema:
          type: string
      - name: status
        required: false
        in: query
        description: Filter by sale status. Comma-separated for a multi-status bucket; omit or pass ALL for no filter.
        schema:
          enum:
          - OPEN
          - PARTIALLY_PAID
          - PAID
          - CANCELLED
          - NO_SHOW
          - VOIDED
          - REFUND_INITIATED
          - PARTIALLY_REFUNDED
          - REFUNDED
          type: string
      - name: entityId
        required: true
        in: query
        description: Entity ID
        schema:
          type: string
      responses:
        '200':
          description: Sales retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  sales:
                    type: array
                    items:
