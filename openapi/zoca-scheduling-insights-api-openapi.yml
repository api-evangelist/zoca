        '400':
          description: Invalid query parameters
      summary: Get sales insights data
      tags:
      - Scheduling Insights
  /scheduling/insights-and-reports/appointments-tracker-stats:
    get:
      description: Returns appointments and sales data aggregated by weekly or monthly periods. Includes onboarding markers for each period and totals.
      operationId: t_value
      parameters:
      - name: businessEntityId
        required: false
        in: query
        description: Business entity ID to filter by business
        schema:
          type: string
      - name: locationEntityId
        required: false
        in: query
        description: Location entity ID to filter by specific location
        schema:
          type: string
      - name: granularity
        required: true
        in: query
        description: Data aggregation granularity (WEEKLY or MONTHLY)
        schema:
          enum:
          - WEEKLY
          - MONTHLY
          type: string
      - name: endDate
        required: true
        in: query
        description: End date for the appointments tracker data (ISO date string)
        schema:
          example: '2025-12-31'
          type: string
      - name: startDate
        required: true
        in: query
        description: Start date for the appointments tracker data (ISO date string)
        schema:
          example: '2025-01-01'
          type: string
      responses:
        '200':
          description: Appointments tracker stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/e'
        '400':
          description: Invalid query parameters
      summary: Get appointments tracker stats
      tags:
      - Scheduling Insights
components:
  schemas:
    e:
      type: object
      properties:
        id:
          type: number
        entityId:
          type: string
        attribute:
          type: string
        value:
          type:
          - object
          - 'null'
        metadata:
          type:
          - object
          - 'null'
        createdAt:
          type:
          - object
          - 'null'
      required:
      - id
      - entityId
      - attribute
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: Authorization
      description: Enter JWT token in the format Bearer <token>
      in: header
