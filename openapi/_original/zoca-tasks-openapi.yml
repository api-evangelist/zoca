                    type: string
                    format: date-time
                    example: '2023-12-07T10:30:00.000Z'
                  status:
                    type: string
                    example: success
        '500':
          description: Internal server error during notes upsert
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Failed to upsert notes
                  error:
                    type: string
                    example: Database connection failed
                  timestamp:
                    type: string
                    format: date-time
                    example: '2023-12-07T10:30:00.000Z'
                  status:
                    type: string
