                  data:
                    type: object
                    properties:
                      entityId:
                        type: string
                        example: 123e4567-e89b-12d3-a456-426614174000
                      notes:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              example: support
                            note:
                              type: string
                              example: Customer requested additional support
                        example:
                        - type: support
                          note: Customer requested additional support
                        - type: sales
                          note: Follow up scheduled for next week
                      updatedAt:
