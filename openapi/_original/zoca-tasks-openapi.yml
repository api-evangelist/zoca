  /tasks/api/v1/platform-scraper/services-comparison:
    post:
      description: Compares services from a Zoca site against a booking platform to identify missing, incorrect, or mismatched services. Returns detailed comparison with confidence scores.
      operationId: t_value
      parameters: []
      responses:
        '200':
          description: Service comparison completed successfully
          content:
            application/json:
              schema:
                example:
                  overallConfidence: 85.5
                  totalBookingServices: 20
                  totalZocaServices: 21
                  matched: 17
                  missing: 3
                  potentiallyWrong: 1
                  extra: 4
                  bookingPlatform: Fresha
                  services:
                  - bookingService:
                      title: Male Haircut
                      description: Professional haircut service
                      price: $50
                      duration: 45mins
                      serviceId: s:12345
                    zocaService:
                      title: Men's Haircut
                      description: Professional haircut service
                      price: $50
                      duration: 45mins
                    confidence: 0.92
                    status: matched
                  - bookingService:
                      title: Tape-ins Full Head
                      description: Includes extensions that are attached with hair tape. This service is best if you want the look of a full weave.
                      price: $450
                      duration: 250min
                      serviceId: s:12346
                    zocaService:
                      title: Tape-ins Full Head
                      description: eeks with proper maintenance. Consultation included to determine if hair is strong enough.
                      price: $450+
                      duration: '4h : 10min'
                    confidence: 1
                    status: matched
                    issues:
                    - 'Description mismatch: 53.2% similarity (threshold: 90%)'
                  - bookingService:
                      title: Color Treatment
                      description: Full color service with conditioning
                      price: $120
                      duration: 120min
                      serviceId: s:12347
                    zocaService:
                      title: Color Service
                      description: Full color service with conditioning
                      price: $135
                      duration: 2h
                    confidence: 0.65
                    status: potentially_wrong
                    issues:
                    - 'Price mismatch: booking=$120, zoca=$135 (15.00 difference)'
                  - bookingService:
                      title: Trim Service
                      description: Basic trim to maintain health of hair
                      price: $20
                      duration: 10min
                      serviceId: s:12348
                    zocaService: null
                    confidence: 0
                    status: missing
                  - bookingService: null
                    zocaService:
                      title: Special Promo Service
                      description: Limited time offer - discounted service
                      price: $30
                      duration: 30mins
                    confidence: 0
                    status: extra
        '400':
          description: Invalid request parameters
        '500':
          description: Service comparison failed
      summary: Compare Zoca services against booking platform services
      tags:
      - Platform Scraper
