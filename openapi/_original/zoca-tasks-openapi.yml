  /tasks/api/v1/employees/{entityId}:
    patch:
      description: Updates employee information including regular columns, complete attributes, or specific attribute keys. All fields are optional.
      operationId: t_value
      parameters: []
      requestBody:
        required: true
        description: Employee update data with optional fields
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/e'
            examples:
              Update Name Only:
                value:
                  firstName: John
                  lastName: Doe
                description: Update only first and last name
              Update Active Status:
                value:
                  isActive: false
                description: Deactivate employee
              Update AM Capacity (Partial):
                value:
                  attributesPartial:
                    amConfig:
                      capacity: 75
                description: Update only AM capacity without affecting other AM config
              Enable Handover:
                value:
                  attributesPartial:
                    isHandoverActive: true
                description: Enable handover status for employee
              Update Multiple Fields:
                value:
                  firstName: Jane
                  isActive: true
                  attributesPartial:
                    isHandoverActive: false
                    amConfig:
                      capacity: 50
                      categories:
                      - retail
                      - healthcare
                description: Update name, active status, and partial attributes
              Replace Complete Attributes:
                value:
                  attributes:
                    amConfig:
                      categories:
                      - restaurant
                      - retail
                      capacity: 100
                      notes:
                      - Senior account manager
                      - Handles enterprise clients
                    calendlyConfig:
                      checkInUrl: https://calendly.com/jane-doe/check-in
                      checkinUrlEventTypeUri: jane-doe/check-in
                    isHandoverActive: true
                description: Replace entire attributes object
              Update Calendly Config:
                value:
                  attributesPartial:
                    calendlyConfig:
                      checkInUrl: https://calendly.com/new-url/meeting
                description: Update only Calendly URL
              Change Employee Type:
                value:
                  type: AM
                description: Change employee type/role
      responses:
        '200':
          description: Employee successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employee updated successfully
                  data:
                    type: object
                    properties:
                      entityId:
                        type: string
                        example: 123e4567-e89b-12d3-a456-426614174000
                      firstName:
                        type: string
                        example: John
                      lastName:
                        type: string
                        example: Doe
                      type:
                        type: string
                        enum:
                        - AM
                        - AE
                        - DEVELOPER
                        - SALES_LEAD
                        - CX_LEAD
                        - SOCIAL_MEDIA
                        - DEVELOPER_3P
                        - ADMIN
                        - SDR
                        - AI_AGENT
                        - MARKETING_TEAM
                        example: AM
                      isActive:
                        type: boolean
                        example: true
                      attributes:
                        type: object
                        description: Employee-specific configuration
                        properties:
                          amConfig:
                            type: object
                            properties:
                              categories:
                                type: array
                                items:
                                  type: string
                                example:
                                - retail
                                - restaurant
                              capacity:
                                type: number
                                example: 50
                              notes:
                                type: array
                                items:
                                  type: string
                                example:
                                - Experienced AM
                          calendlyConfig:
                            type: object
                            properties:
                              checkInUrl:
                                type: string
                                example: https://calendly.com/...
                              checkinUrlEventTypeUri:
                                type: string
                                example: user/check-in
                          isHandoverActive:
                            type: boolean
                            example: true
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Employee not found with entityId: xxx'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to update employee
      security:
      - {}
      summary: Update an existing employee
      tags:
      - Employees
