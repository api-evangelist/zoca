        required: true
        in: path
        description: Square customer ID
        schema:
          example: CUST_123ABC
      requestBody:
        required: true
        description: Card creation parameters
        content:
          application/json:
            schema:
              type: object
              required:
              - entityId
              - sourceId
              - card
              properties:
                entityId:
                  type: string
                  description: Entity ID for authentication
                  example: entity-123
                sourceId:
                  type: string
                  description: Card nonce from Square Web Payments SDK
                  example: cnon:card-nonce-ok
                card:
                  type: object
                  required:
                  - sourceId
                  - cardholderName
                  - billingAddress
                  properties:
                    sourceId:
                      type: string
                      description: Card nonce from Square Web Payments SDK
                    cardholderName:
                      type: string
                      description: Name on card
                      example: John Doe
                    billingAddress:
                      type: object
                      required:
                      - addressLine1
                      - locality
                      - administrativeDistrictLevel1
                      - postalCode
                      - country
                      properties:
                        addressLine1:
                          type: string
                          example: 123 Main St
                        addressLine2:
                          type: string
                          example: Apt 4B
                        locality:
                          type: string
                          example: San Francisco
                        administrativeDistrictLevel1:
                          type: string
                          example: CA
                        postalCode:
                          type: string
                          example: '94102'
                        country:
                          type: string
                          example: US
      responses:
        '201':
          description: Card created successfully
        '400':
          description: Invalid card data
        '404':
          description: Customer not found
        '500':
          description: Error creating card
      summary: Create a new card on file for a customer
      tags:
      - Square
