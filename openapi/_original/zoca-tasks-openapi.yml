                    type: array
                    items:
                      type: string
                    example:
                    - unknown service
                  processingTime:
                    type: number
                    description: Processing time in milliseconds
        '400':
          description: Invalid input
        '500':
          description: Internal server error
      summary: Map keywords to existing buckets and categories
      tags:
      - Local SEO
