      tags:
      - Scheduling - Policies
  /scheduling/policies/map:
    post:
      operationId: t_value
      parameters: []
      responses:
        '201':
          description: Mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/e'
      summary: Map a policy to an entity
      tags:
      - Scheduling - Policies
  /scheduling/policies/map/{mappingId}:
    delete:
      operationId: t_value
      parameters:
      - name: mappingId
        required: true
        in: path
        description: Mapping ID
        schema: {}
      responses:
        '204':
          description: Mapping removed
      summary: Remove a policy mapping
      tags:
      - Scheduling - Policies
  /scheduling/policies/map/{mappingId}/default:
    put:
      operationId: t_value
      parameters:
      - name: mappingId
        required: true
        in: path
        description: Mapping ID
        schema: {}
      responses:
        '200':
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/e'
      summary: Set a policy mapping as default
      tags:
      - Scheduling - Policies
  /scheduling/policies/map/policy/{policyId}:
    get:
      operationId: t_value
      parameters:
      - name: policyTable
        required: true
        in: query
        description: Policy table
        schema:
          enum:
          - fee_policies
          - payment_policies
          - booking_policies
          type: string
      - name: policyId
        required: true
        in: path
        description: Policy ID
        schema: {}
      responses:
        '200':
          description: List of mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/e'
      summary: Get all mappings for a policy
      tags:
      - Scheduling - Policies
  /scheduling/policies/map/entity/{entityId}:
    get:
      operationId: t_value
      parameters:
      - name: policyTable
        required: false
        in: query
        description: Policy table filter
        schema:
          enum:
          - fee_policies
          - payment_policies
          - booking_policies
          type: string
      - name: entityType
        required: true
        in: query
        description: Entity type
        schema:
