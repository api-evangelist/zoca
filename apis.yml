- aid: zoca:zoca-tasks-api
  name: Zoca Tasks API
  slug: zoca-tasks-api
  description: The Zoca tasks and automation service. 785 paths and 855 operations under /tasks/api/v1 covering
    the AI content queue and content planning, FrontDesk voice and SMS agent onboarding on Retell and Twilio, the
    embeddable FrontDesk booking widget, local-SEO grid scans, WIN conversion triggers, and 25 inbound webhook receivers
    for Zoca's own vendors. Served publicly and unauthenticated as an OpenAPI 3.0.0 document at https://tasks.zoca.ai/swagger.json.
    Auth is a bearer JWT.
