aid: zoca
name: Zoca
description: >-
  Zoca is an AI-powered marketing platform built specifically for local beauty and
  wellness businesses such as salons, spas, and clinics. It packages its automation as
  three AI agents: a Discovery Agent that improves online ranking and visibility, a Win
  Agent that converts inquiries and leads into confirmed appointments, and a Loyalty
  Agent that drives repeat bookings and client retention. Zoca also offers free
  self-serve tools including a Local Business Demand Tracker, a Local Website Grader, and
  a Google Business Profile Optimizer. The company reports serving 1,000+ businesses,
  facilitating 120,000+ appointments, and generating $10M+ in customer revenue. Zoca is
  a portfolio company of Accel. As of this enrichment pass it publishes no public
  developer portal, API reference, SDK, or documented API surface.
