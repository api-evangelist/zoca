apis:
- aid: zoca:zoca-platform-api
  name: Zoca Platform API
  slug: zoca-platform-api
  description: The Zoca platform API — the backend the Zoca web application and the iOS/Android apps call. 1,413
    paths and 1,700 operations covering scheduling and bookings, website generation and custom domains, Google Business
    Profile management, discovery and local SEO, social media, services, staff and clients, offers and packages,
    booking enquiries, inventory, Chargebee billing, and the Zoca "brain" agent layer. Served publicly and unauthenticated
    as an OpenAPI 3.0.0 document at https://api.zoca.ai/swagger.json with no accompanying documentation. Auth is
    a bearer JWT.
