- aid: zoca:zoca-public-api
  name: Zoca Public API
  slug: zoca-public-api
  description: Zoca's unauthenticated public surface — the 69 operations behind the free self-serve tools on zoca.com.
    Covers the Local Business Demand Tracker (keyword demand and keyword intelligence), Google Business Profile
    competitor analysis, place metrics and keyword tables, website strategy grading, pricing benchmarks and menu
    analysis, plus short-link and app-link redirects. Served as an OpenAPI 3.0.0 document at https://public.zoca.com/swagger.json.
    This is the only Zoca surface reachable without a Zoca account.
