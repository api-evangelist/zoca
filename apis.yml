aid: zoca
name: Zoca
description: 'Zoca is an AI-powered marketing platform built for local beauty and wellness businesses — salons,
  spas, med spas and wellness clinics. It packages its automation as agents: a Discovery Agent that improves local
  ranking and Google Business Profile visibility, a Win Agent that converts inquiries into confirmed appointments
  over chat, SMS and voice, a Loyalty Agent that drives rebooking and retention, and a Social Agent that produces
  Instagram, TikTok and Facebook content. Zoca also runs free self-serve tools including a Local Business Demand
  Tracker, a Local Website Grader and a Google Business Profile Optimizer. Zoca is operated by ZOCAAI TECHNOLOGIES
  PRIVATE LIMITED, was founded in 2021, and is an Accel portfolio company. Zoca runs no developer program — no portal,
  no API reference, no SDK and no documented API — but it serves three real OpenAPI 3.0.0 documents publicly and
  unauthenticated at api.zoca.ai/swagger.json, tasks.zoca.ai/swagger.json and public.zoca.com/swagger.json, together
  describing 2,624 operations across 2,267 paths. Those are the application''s own backend contracts rather than
  a product, and they ship with minified operationIds and untyped schemas.'
